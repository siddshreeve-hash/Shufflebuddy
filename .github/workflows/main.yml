name: Build Windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A x64
      - run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: ShuffleBuddy-Windows
          path: |
            build/ShuffleBuddy_artefacts/Release/Standalone/Shuffle Buddy.exe
            build/ShuffleBuddy_artefacts/Release/VST3/Shuffle Buddy.vst3
